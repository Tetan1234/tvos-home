plugins { id 'com.android.application' }

android {
    namespace 'com.tetan.tvos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tetan.tvos'
        minSdk 21
        //noinspection ExpiredTargetSdkVersion  (Mi Box runs Android 9)
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    // Fixed key so every new build installs over the old one with adb install -r
    signingConfigs {
        tetan {
            storeFile file('tetan.keystore')
            storePassword 'tvoshome'
            keyAlias 'tvos'
            keyPassword 'tvoshome'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.tetan
        }
        debug { signingConfig signingConfigs.tetan }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}
