name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk tvos-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tvos-home
          path: tvos-home.apk

      # Publishes the APK so the phone can download it without logging in:
      # https://github.com/<you>/tvos-home/releases/latest/download/tvos-home.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: tvos-home.apk
          make_latest: true
