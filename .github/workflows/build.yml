name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle.zip
          ./gradle-8.14.3/bin/gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk tvos-home.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" tvos-home.apk --title "Build ${{ github.run_number }}" --latest
